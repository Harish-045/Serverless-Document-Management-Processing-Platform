name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:

      # 1. Download the latest code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Verify that the Docker image can be built
      - name: Build Docker image
        run: |
          docker build -t serverless-document-platform .

      # 3. Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "========================================"
            echo "Starting deployment"
            echo "========================================"

            cd ~/serverless-document-platform

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Building Docker image..."
            docker build -t serverless-document-platform .

            echo "Stopping old container..."
            docker stop serverless-document-platform || true

            echo "Removing old container..."
            docker rm serverless-document-platform || true

            echo "Starting new container..."
            docker run -d \
              --restart unless-stopped \
              -p 80:80 \
              --name serverless-document-platform \
              serverless-document-platform

            echo "Checking container..."
            sleep 3

            docker ps

            echo "========================================"
            echo "Deployment completed successfully!"
            echo "========================================"